name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

# A push cancels the runs still going on the same branch: only the newest commit's result matters, and commits are
# made once `npm test` and `npm run check` pass locally. Saves runners when GitHub is short of them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit, the release in the comment, as in deploy.yml (the repo refuses unpinned ones).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # Runs check, tests, build, the size gate and the licence notices (see flake.nix).
      - run: nix build --print-build-logs
